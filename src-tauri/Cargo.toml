[package]
name = "seam-share"
version = "0.1.0"
edition = "2021"

[lib]
name = "seam_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
sha2 = "0.10"
x25519-dalek = "2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand_core = "0.6"
