name: Implement tray and auto discovery

on:
  push:
    branches: ["feat/windows-native-v4"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(auto):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-native-v4
          fetch-depth: 0

      - name: Patch Windows native tray and discovery
        shell: python
        run: |
          from pathlib import Path
          import re

          cargo = Path('src-tauri/Cargo.toml')
          s = cargo.read_text()
          s = s.replace('tauri = { version = "2", features = [] }', 'tauri = { version = "2", features = ["tray-icon"] }')
          cargo.write_text(s)

          p = Path('src-tauri/src/lib.rs')
          s = p.read_text()

          s = s.replace(
              'use tauri::{command, AppHandle, Emitter};',
              'use tauri::{command, AppHandle, Emitter, Manager, WindowEvent};\nuse tauri::{menu::{MenuBuilder, MenuItemBuilder}, tray::TrayIconBuilder};'
          )

          s = s.replace(
              '#[derive(Debug,Serialize,Deserialize,Default)] struct Settings{receive_dir:Option<String>}',
              '#[derive(Debug,Serialize,Deserialize,Default)] struct Settings{receive_dir:Option<String>,paired:Option<Vec<PairedDevice>>}'
          )

          old_save = '''fn save_receive_dir(path:&PathBuf)->Result<(),String>{let p=settings_path();if let Some(parent)=p.parent(){fs::create_dir_all(parent).map_err(|e|e.to_string())?}let data=serde_json::to_string_pretty(&Settings{receive_dir:Some(path.to_string_lossy().into_owned())}).map_err(|e|e.to_string())?;fs::write(p,data).map_err(|e|e.to_string())}'''
          new_save = '''fn save_receive_dir(path:&PathBuf)->Result<(),String>{let p=settings_path();if let Some(parent)=p.parent(){fs::create_dir_all(parent).map_err(|e|e.to_string())?}let mut settings=fs::read_to_string(&p).ok().and_then(|s|serde_json::from_str::<Settings>(&s).ok()).unwrap_or_default();settings.receive_dir=Some(path.to_string_lossy().into_owned());let data=serde_json::to_string_pretty(&settings).map_err(|e|e.to_string())?;fs::write(p,data).map_err(|e|e.to_string())}\nfn load_paired_devices()->Vec<PairedDevice>{fs::read_to_string(settings_path()).ok().and_then(|s|serde_json::from_str::<Settings>(&s).ok()).and_then(|s|s.paired).unwrap_or_default()}\nfn save_paired_devices(list:&[PairedDevice])->Result<(),String>{let p=settings_path();if let Some(parent)=p.parent(){fs::create_dir_all(parent).map_err(|e|e.to_string())?}let mut settings=fs::read_to_string(&p).ok().and_then(|s|serde_json::from_str::<Settings>(&s).ok()).unwrap_or_default();settings.paired=Some(list.to_vec());let data=serde_json::to_string_pretty(&settings).map_err(|e|e.to_string())?;fs::write(p,data).map_err(|e|e.to_string())}'''
          if old_save not in s:
              raise SystemExit('save_receive_dir anchor not found')
          s = s.replace(old_save, new_save)

          old_pair = 'if let Ok(mut list)=s.paired.lock(){list.retain(|p|p.device_id!=pair.device_id);list.push(PairedDevice{device_id:pair.device_id,device_name:pair.device_name,ip:pair.ip,port:pair.port,token:pair.token});}respond(&mut stream,200,"{}");return}'
          new_pair = 'if let Ok(mut list)=s.paired.lock(){list.retain(|p|p.device_id!=pair.device_id);list.push(PairedDevice{device_id:pair.device_id,device_name:pair.device_name,ip:pair.ip,port:pair.port,token:pair.token});let _=save_paired_devices(&list);}respond(&mut stream,200,"{}");return}'
          if old_pair not in s:
              raise SystemExit('pair anchor not found')
          s = s.replace(old_pair, new_pair)

          marker = '#[cfg_attr(mobile,tauri::mobile_entry_point)] pub fn run()'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('run marker not found')

          prefix = s[:idx]
          run_tail = s[idx:]
          run_match = re.match(r'#\[cfg_attr\(mobile,tauri::mobile_entry_point\)\] pub fn run\(\)\{.*\}\s*$', run_tail, re.S)
          if not run_match:
              raise SystemExit('run function parse failed')

          new_tail = '''fn auto_discovery(state:AppState,app:AppHandle){thread::spawn(move||{loop{thread::sleep(Duration::from_secs(5));let paired=state.paired.lock().map(|p|p.clone()).unwrap_or_default();if paired.is_empty(){continue}let socket=match UdpSocket::bind((Ipv4Addr::UNSPECIFIED,0)){Ok(v)=>v,Err(_)=>continue};let _=socket.set_broadcast(true);let _=socket.set_read_timeout(Some(Duration::from_millis(180)));let msg=format!("{}|{}|{}",MAGIC,state.device_name,TRANSFER_PORT);let _=socket.send_to(msg.as_bytes(),(Ipv4Addr::BROADCAST,DISCOVERY_PORT));let deadline=Instant::now()+Duration::from_millis(900);let mut buf=[0u8;1024];let mut found=Vec::new();while Instant::now()<deadline{if let Ok((len,addr))=socket.recv_from(&mut buf){let text=String::from_utf8_lossy(&buf[..len]);let parts:Vec<&str>=text.split('|').collect();if parts.len()==3&&parts[0]==MAGIC{if let Ok(port)=parts[2].parse::<u16>(){found.push((parts[1].to_string(),addr.ip().to_string(),port));}}}}if let Ok(mut list)=state.paired.lock(){let mut changed=false;for p in list.iter_mut(){if let Some((_,ip,port))=found.iter().find(|(name,_,_)|name==&p.device_name){if p.ip!=*ip||p.port!=*port{p.ip=ip.clone();p.port=*port;changed=true;}}}if changed{let _=save_paired_devices(&list);let _=app.emit("paired-devices-updated",());}}}})}

#[cfg_attr(mobile,tauri::mobile_entry_point)] pub fn run(){let receive_dir=load_receive_dir();let _=fs::create_dir_all(&receive_dir);let state=AppState{device_id:make_id(),device_name:"This PC".into(),token:make_id(),paired:Arc::new(Mutex::new(load_paired_devices())),cancel:Arc::new(Mutex::new(Vec::new())),receive_dir:Arc::new(Mutex::new(receive_dir)),pending:Arc::new(Mutex::new(HashMap::new()))};let d=state.device_name.clone();thread::spawn(move||run_discovery_responder(d));tauri::Builder::default().plugin(tauri_plugin_dialog::init()).manage(state.clone()).setup(move|app|{let h=app.handle().clone();let s=state.clone();thread::spawn(move||transfer_server(s,h));let open=MenuItemBuilder::with_id("open","Open SEAM Share").build(app)?;let send_file=MenuItemBuilder::with_id("send-file","Send File").build(app)?;let send_text=MenuItemBuilder::with_id("send-text","Send Text").build(app)?;let settings=MenuItemBuilder::with_id("settings","Settings").build(app)?;let exit=MenuItemBuilder::with_id("exit","Exit").build(app)?;let menu=MenuBuilder::new(app).items(&[&open,&send_file,&send_text,&settings,&exit]).build()?;TrayIconBuilder::new().menu(&menu).tooltip("SEAM Share — Ready").icon(app.default_window_icon().cloned().ok_or("default app icon unavailable")?).on_menu_event(|app,event|match event.id().as_ref(){"open"=>{if let Some(w)=app.get_webview_window("main"){let _=w.show();let _=w.set_focus();}},"send-file"=>{let _=app.emit("tray-action","send-file");if let Some(w)=app.get_webview_window("main"){let _=w.show();let _=w.set_focus();}},"send-text"=>{let _=app.emit("tray-action","send-text");if let Some(w)=app.get_webview_window("main"){let _=w.show();let _=w.set_focus();}},"settings"=>{let _=app.emit("tray-action","settings");if let Some(w)=app.get_webview_window("main"){let _=w.show();let _=w.set_focus();}},"exit"=>app.exit(0),_=>{}}).build(app)?;auto_discovery(state.clone(),app.handle().clone());Ok(())}).on_window_event(|window,event|{if let WindowEvent::CloseRequested{api,..}=event{api.prevent_close();let _=window.hide();}}).invoke_handler(tauri::generate_handler![network_info,discover_devices,pairing_info,paired_devices,send_file,cancel_transfer,receive_directory,set_receive_directory,list_files,approve_incoming]).run(tauri::generate_context!()).expect("error while running tauri application")}'''

          p.write_text(prefix + new_tail + '\n')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/src/lib.rs
          git diff --cached --quiet || git commit -m "chore(auto): wire tray and paired discovery"
          git push origin feat/windows-native-v4
