name: Build SEAM Share Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: seam-share-windows-web
          path: dist
